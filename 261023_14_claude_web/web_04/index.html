<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모노 계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <section class="calc" aria-label="계산기">
      <div class="display" role="status" aria-live="polite">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
      </div>

      <div class="keys" id="keys">
        <button class="key fn" data-action="clear">C</button>
        <button class="key fn" data-action="sign" aria-label="부호 전환">±</button>
        <button class="key fn" data-action="percent" aria-label="퍼센트">%</button>
        <button class="key op" data-action="operator" data-value="÷" aria-label="나누기">÷</button>

        <button class="key" data-action="digit" data-value="7">7</button>
        <button class="key" data-action="digit" data-value="8">8</button>
        <button class="key" data-action="digit" data-value="9">9</button>
        <button class="key op" data-action="operator" data-value="×" aria-label="곱하기">×</button>

        <button class="key" data-action="digit" data-value="4">4</button>
        <button class="key" data-action="digit" data-value="5">5</button>
        <button class="key" data-action="digit" data-value="6">6</button>
        <button class="key op" data-action="operator" data-value="−" aria-label="빼기">−</button>

        <button class="key" data-action="digit" data-value="1">1</button>
        <button class="key" data-action="digit" data-value="2">2</button>
        <button class="key" data-action="digit" data-value="3">3</button>
        <button class="key op" data-action="operator" data-value="+" aria-label="더하기">+</button>

        <button class="key" data-action="backspace" aria-label="한 글자 지우기">⌫</button>
        <button class="key" data-action="digit" data-value="0">0</button>
        <button class="key" data-action="decimal" aria-label="소수점">.</button>
        <button class="key op" data-action="equals" aria-label="계산">=</button>
      </div>
    </section>

    <aside class="history" aria-label="계산 기록">
      <div class="history-head">
        <h2>기록</h2>
        <button class="history-clear" id="historyClear" type="button">모두 지우기</button>
      </div>
      <ol class="history-list" id="historyList">
        <li class="history-empty">계산하면 여기에 쌓입니다.</li>
      </ol>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
