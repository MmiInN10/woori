<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>레인보우 계산기</title>
  <script>
    // 첫 페인트 전에 테마를 정해서 깜빡임을 막는다.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="다크 모드로 전환">🌙</button>

    <section class="display" aria-label="계산 화면">
      <div id="expression" class="display__expression"></div>
      <div id="result" class="display__result" aria-live="polite">0</div>
    </section>

    <section class="keys" id="keys" aria-label="계산기 버튼">
      <button type="button" class="key key--indigo" data-action="clear">C</button>
      <button type="button" class="key key--violet" data-action="backspace" aria-label="지우기">⌫</button>
      <button type="button" class="key" data-action="percent">%</button>
      <button type="button" class="key key--red" data-action="op" data-value="/" aria-label="나누기">÷</button>

      <button type="button" class="key key--num" data-action="digit" data-value="7">7</button>
      <button type="button" class="key key--num" data-action="digit" data-value="8">8</button>
      <button type="button" class="key key--num" data-action="digit" data-value="9">9</button>
      <button type="button" class="key key--orange" data-action="op" data-value="*" aria-label="곱하기">×</button>

      <button type="button" class="key key--num" data-action="digit" data-value="4">4</button>
      <button type="button" class="key key--num" data-action="digit" data-value="5">5</button>
      <button type="button" class="key key--num" data-action="digit" data-value="6">6</button>
      <button type="button" class="key key--yellow" data-action="op" data-value="-" aria-label="빼기">−</button>

      <button type="button" class="key key--num" data-action="digit" data-value="1">1</button>
      <button type="button" class="key key--num" data-action="digit" data-value="2">2</button>
      <button type="button" class="key key--num" data-action="digit" data-value="3">3</button>
      <button type="button" class="key key--green" data-action="op" data-value="+" aria-label="더하기">+</button>

      <button type="button" class="key" data-action="negate" aria-label="부호 바꾸기">±</button>
      <button type="button" class="key key--num" data-action="digit" data-value="0">0</button>
      <button type="button" class="key" data-action="dot" aria-label="소수점">.</button>
      <button type="button" class="key key--blue" data-action="equals" aria-label="계산">=</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
